<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Probability Lab 3D | ห้องทดลองความน่าจะเป็น ม.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--ink:#1d2342;--muted:#667092;--line:rgba(120,130,190,.2);
--purple:#6f5bd8;--purple2:#8f7cf0;--pink:#ef476f;--blue:#4d8cff;--green:#22b39a;--gold:#f2b84b;
--glass:rgba(255,255,255,.68);--shadow:0 18px 50px rgba(60,66,140,.14)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Prompt","Noto Sans Thai",Tahoma,system-ui,sans-serif;color:var(--ink);line-height:1.55;overflow:hidden;
background:radial-gradient(900px 520px at 8% -10%,#e2dcff 0,transparent 60%),radial-gradient(800px 520px at 100% 0,#d8f6ef 0,transparent 55%),radial-gradient(700px 500px at 60% 110%,#ffe4ee 0,transparent 55%),#eef1fb;background-attachment:fixed}
button{font-family:inherit}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border:1px solid rgba(255,255,255,.85);box-shadow:0 8px 30px rgba(60,66,140,.12)}
#app{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(370px,.62fr);gap:16px;height:100vh;height:100dvh;padding:16px}
#stage{position:relative;border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);background:linear-gradient(160deg,#f8f6ff 0%,#e9eeff 45%,#e3f7f2 100%);min-height:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:0}
#gl:active{cursor:grabbing}
#hotspots{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hotspot{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;font-weight:600;font-size:14px;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 18px rgba(111,91,216,.45);pointer-events:auto;transition:opacity .25s,box-shadow .25s;will-change:transform;z-index:3}
.hotspot::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(111,91,216,.5);animation:ping 1.9s ease-out infinite}
.hotspot .tip{position:absolute;left:46px;top:50%;transform:translateY(-50%) translateX(-6px);white-space:nowrap;padding:5px 11px;border-radius:10px;background:#1d2342;color:#fff;font-size:12px;font-weight:400;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.hotspot.flip .tip{left:auto;right:46px;transform:translateY(-50%) translateX(6px)}
.hotspot:hover .tip,.hotspot.active .tip{opacity:1;transform:translateY(-50%)}
.hotspot.active{background:linear-gradient(135deg,var(--gold),var(--pink));box-shadow:0 6px 22px rgba(242,184,75,.6)}
.hotspot.hidden{opacity:0;pointer-events:none}
@keyframes ping{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.hint{position:absolute;left:16px;top:16px;max-width:calc(100% - 140px);padding:8px 14px;border-radius:999px;font-size:12.5px;color:var(--muted);transition:opacity .6s,transform .6s;z-index:4}
.hint.hide{opacity:0;transform:translateY(-6px);pointer-events:none}
.tools{position:absolute;right:16px;top:16px;display:flex;gap:8px;z-index:4}
.tool{width:42px;height:42px;border-radius:14px;cursor:pointer;font-size:19px;color:var(--ink);display:grid;place-items:center;padding:0;transition:transform .2s,background .2s}
.tool:hover{transform:translateY(-2px)}
.tool.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.legend{position:absolute;right:16px;top:68px;display:flex;flex-direction:column;gap:6px;padding:10px 14px;border-radius:16px;font-size:12px;z-index:4}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px}
.legend .lt{background:rgba(111,91,216,.35);border:2px solid var(--purple)}
.legend .le{background:var(--purple)}
.toast{position:absolute;left:50%;top:66px;transform:translate(-50%,-14px) scale(.9);opacity:0;padding:9px 20px;border-radius:999px;font-weight:600;font-size:15px;z-index:6;pointer-events:none;transition:opacity .28s,transform .28s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.warn{background:#fff3d6;border-color:#f8dd94;color:#8a5a00}
.dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border-radius:22px;z-index:5;max-width:calc(100% - 24px)}
.dbtn{border:0;border-radius:14px;padding:11px 16px;font-weight:600;font-size:14px;cursor:pointer;background:rgba(111,91,216,.1);color:var(--ink);min-height:44px;transition:transform .15s,background .2s,opacity .2s;white-space:nowrap}
.dbtn:hover{transform:translateY(-2px)}
.dbtn:active{transform:scale(.97)}
.dbtn.main{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;box-shadow:0 8px 20px rgba(111,91,216,.35)}
.dbtn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.card3d{position:absolute;left:16px;bottom:86px;width:min(350px,calc(100% - 32px));padding:18px 18px 12px;border-radius:24px;opacity:0;transform:translateY(20px) scale(.96);pointer-events:none;transition:opacity .35s,transform .35s cubic-bezier(.2,.9,.3,1.2);z-index:6;background:rgba(255,255,255,.86)}
.card3d.show{opacity:1;transform:none;pointer-events:auto}
.card3d .x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:10px;border:0;background:rgba(111,91,216,.1);color:var(--muted);cursor:pointer;font-size:14px}
.cbody.swap{animation:swap .45s ease}
@keyframes swap{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
.chead{display:flex;gap:12px;align-items:center;margin-bottom:8px;padding-right:30px}
.cicon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#eee9ff,#ffe6ef);flex:0 0 auto}
.ckick{font-size:11px;letter-spacing:.06em;color:var(--purple);font-weight:600;text-transform:uppercase}
.card3d h3{margin:0;font-size:17px;line-height:1.3}
.card3d p{margin:0 0 10px;font-size:13.5px;color:#3a4268}
.live{background:linear-gradient(135deg,#f3f0ff,#e9fbf6);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:500;color:#3b3590}
.live small{display:block;color:var(--muted);font-weight:400;margin-bottom:2px;font-size:11.5px}
.cnav{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.cnav button{width:32px;height:32px;border-radius:10px;border:0;background:rgba(111,91,216,.1);color:var(--purple);font-size:18px;cursor:pointer}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:#d3d6ee;cursor:pointer;transition:all .25s}
.dots i.on{width:20px;border-radius:6px;background:var(--purple)}
.fallback{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;z-index:9;background:rgba(244,246,255,.92);color:var(--ink);font-weight:500}
#panel{display:flex;flex-direction:column;min-height:0;border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.phead{padding:20px 22px 10px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-block;border-radius:999px;padding:4px 12px;font-size:11.5px;font-weight:600;letter-spacing:.04em;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff}
.lang{display:inline-flex;gap:3px;padding:3px;border-radius:999px;background:rgba(111,91,216,.1)}
.lang button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);min-height:34px}
.lang button.active{background:#fff;color:var(--purple);box-shadow:0 3px 10px rgba(111,91,216,.2)}
h1{font-size:clamp(22px,2.1vw,28px);margin:10px 0 4px;line-height:1.25}
.sub{margin:0;color:var(--muted);font-size:13.5px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 22px 12px}
.tab{border:0;border-radius:14px;padding:10px 6px;font-weight:600;font-size:13.5px;cursor:pointer;background:rgba(111,91,216,.08);color:var(--muted);transition:all .25s;min-height:42px}
.tab.active{background:#fff;color:var(--purple);box-shadow:0 6px 16px rgba(111,91,216,.18)}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:4px 22px 26px;scrollbar-width:thin}
.pane{display:none}
.pane.active{display:block;animation:rise .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h2{font-size:16.5px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:13px;margin:0 0 8px}
.obj{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:6px}
.obj h2{margin-top:0}
.obj p{margin:0 0 10px;font-size:13.5px}
.formula{background:linear-gradient(135deg,#f0ecff,#e6faf5);border-radius:12px;padding:10px 12px;font-weight:600;color:#4b3fb5;text-align:center;font-size:14.5px}
.ctl{margin:14px 0}
.ctl label{display:flex;justify-content:space-between;align-items:center;font-weight:500;font-size:14px;gap:8px}
.pill{background:rgba(111,91,216,.1);color:var(--purple);border-radius:999px;padding:2px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--c) var(--p,0%),#e3e6f6 var(--p,0%));outline:0;margin:12px 0 4px;cursor:pointer;--c:var(--purple)}
input[type=range]::-webkit-slider-runnable-track{background:transparent;height:8px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:#fff;border:4px solid var(--c);box-shadow:0 3px 10px rgba(60,66,140,.3)}
input[type=range]::-moz-range-track{background:transparent;height:8px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--c);box-shadow:0 3px 10px rgba(60,66,140,.3)}
input[type=range]:disabled{opacity:.5;cursor:not-allowed}
#red{--c:var(--pink)}#blue{--c:var(--blue)}#green{--c:var(--green)}
.note{background:#fff8e7;border:1px solid #f8e5ad;padding:10px 13px;border-radius:12px;font-size:12.5px;margin-top:10px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.stat{border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;background:rgba(255,255,255,.75)}
.stat strong{display:block;font-size:22px;color:var(--purple);overflow-wrap:anywhere;line-height:1.3}
.stat span{font-size:12px;color:var(--muted)}
.barwrap{margin:12px 0}
.barlabel{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:5px;align-items:baseline}
.barlabel strong{text-align:right;font-weight:600}
.track{position:relative;height:14px;border-radius:99px;background:#e8ebf8}
.fill{height:100%;border-radius:99px;transition:width .35s}
.tick{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;border-radius:3px;background:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:999px;padding:7px 12px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s;min-height:36px}
.chip:hover,.chip.active{background:var(--purple);color:#fff;border-color:var(--purple);transform:translateY(-1px)}
canvas#trend{width:100%;height:230px;border:1px solid var(--line);border-radius:16px;background:#fff;display:block}
.question{border:1px solid var(--line);padding:14px;border-radius:16px;margin:12px 0;background:rgba(255,255,255,.7)}
.question p{margin:0 0 10px;font-weight:600;font-size:14px}
.options{display:grid;gap:7px}
.options label{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border-radius:11px;background:#f6f7ff;cursor:pointer;font-size:13.5px;min-height:42px;transition:background .2s}
.options label:hover{background:#ece8ff}
.options input{margin-top:3px;accent-color:var(--purple)}
.feedback{font-size:13px;margin-top:8px;font-weight:600}
.correct{color:#12836d}.incorrect{color:#c74a72}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:600;cursor:pointer;background:var(--purple);color:#fff;font-size:14px;min-height:44px}
.btn.teal{background:var(--green)}.btn.secondary{background:#eceefb;color:var(--ink)}
#score{margin-top:12px;font-weight:700;font-size:16px;color:var(--purple)}
@media(max-width:1000px){
body{overflow:auto}
#app{display:block;height:auto;padding:10px}
#stage{position:sticky;top:10px;height:52vh;height:52dvh;min-height:340px;z-index:10;margin-bottom:12px}
#panel{overflow:visible}
.pbody{overflow:visible}
.legend{display:none}
}
@media(max-width:600px){
#stage{height:48vh;height:48dvh;min-height:320px;border-radius:22px}
#panel{border-radius:22px}
.hint{font-size:11.5px;max-width:calc(100% - 110px);padding:6px 12px}
.card3d{left:10px;width:calc(100% - 20px);bottom:76px;padding:14px 14px 10px;max-height:62%;overflow:auto}
.card3d p{font-size:12.5px}
.dock{bottom:10px;gap:6px;padding:6px}
.dbtn{padding:10px 11px;font-size:13px}
.phead,.pbody{padding-left:16px;padding-right:16px}
.tabs{padding-left:16px;padding-right:16px}
.toast{font-size:13px;top:62px}
}
</style>
</head>
<body>
<div id="app">

<div class="legend glass"><span><i class="lt"></i><b data-i18n="legendTheory"></b></span><span><i class="le"></i><b data-i18n="legendExp"></b></span></div>

<div class="card3d glass" id="card" role="dialog" aria-live="polite">
<button class="x" id="cardClose" type="button" aria-label="close">✕</button>
<div class="cbody" id="cardBody"></div>
<div class="cnav"><button id="cardPrev" type="button" aria-label="previous">‹</button><div class="dots" id="dots"></div><button id="cardNext" type="button" aria-label="next">›</button></div>

<p class="sub" data-i18n="subtitle"></p>
</div>
<div class="tabs" role="tablist">

<h2 data-i18n="setupTitle"></h2>
<p class="muted" data-i18n="setupText"></p>

<div class="stat"><strong id="trials">0</strong><span data-i18n="trialsLabel"></span></div>
<div class="stat"><strong id="theory">30%</strong><span data-i18n="redChanceLabel"></span></div>
<div class="stat"><strong id="last">—</strong><span data-i18n="lastLabel"></span></div>
</div>
<h2 data-i18n="theoryTitle"></h2>
<div id="theoryBars"></div>
<h2 data-i18n="exploreTitle"></h2>

<div class="btnrow"><button class="btn teal" type="submit" data-i18n="checkBtn"></button><button class="btn secondary" type="button" id="showAnswers" data-i18n="answersBtn"></button><button class="btn secondary" type="button" id="clearQuiz" data-i18n="clearBtn"></button></div>

</form>
</div>
</div>
</aside>

function makeLabel(w,h,fs){
const cv=document.createElement('canvas');
cv.width=w*2;cv.height=h*2;
const tex=new THREE.CanvasTexture(cv);
tex.minFilter=THREE.LinearFilter;
const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
sp.scale.set(w/100,h/100,1);
sp.renderOrder=10;
sp.userData={cv:cv,tex:tex,fs:fs,last:null};
return sp;
}
function roundRect(g,x,y,w,h,r){
g.beginPath();
g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);
g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);
g.closePath();
}
function setLabel(sp,text,o){
const d=sp.userData;
const key=text+'|'+(o?o.fg+o.bg:'');
if(d.last===key)return;
d.last=key;
const g=d.cv.getContext('2d');
g.clearRect(0,0,d.cv.width,d.cv.height);
if(text){
g.font='600 '+(d.fs*2)+'px Prompt,"Noto Sans Thai",Tahoma,sans-serif';
g.textAlign='center';g.textBaseline='middle';
const tw=Math.min(d.cv.width-6,g.measureText(text).width+d.fs*1.6);
const th=d.cv.height-8;
g.fillStyle=o.bg;
roundRect(g,(d.cv.width-tw)/2,4,tw,th,th/2);
g.fill();
g.fillStyle=o.fg;
g.fillText(text,d.cv.width/2,d.cv.height/2+2);
}
d.tex.needsUpdate=true;
}

return Math.max(1,1.4/a);

function makeBall(c,k){
const mat=new THREE.MeshPhysicalMaterial({color:c.hex,roughness:0.28,metalness:0.05,clearcoat:1,clearcoatRoughness:0.12,emissive:c.hex,emissiveIntensity:0});
const mesh=new THREE.Mesh(scene.userData.ballGeo,mat);
mesh.castShadow=true;
mesh.receiveShadow=true;
const a=Math.random()*Math.PI*2;
const rr=Math.random()*(R-BR-0.25);
const b={mesh:mesh,mat:mat,color:c.key,pos:new THREE.Vector3(Math.cos(a)*rr,H+0.7+(k%12)*0.5+Math.random()*0.3,Math.sin(a)*rr),vel:new THREE.Vector3(0,0,0),state:'free',s:0.01,flash:0};
mesh.scale.setScalar(0.01);
mesh.position.copy(b.pos);
jarGroup.add(mesh);
return b;
}
function syncBalls(){
if(!ready3d)return;
let k=0;
COLORS.forEach(c=>{
const alive=balls.filter(b=>b.color===c.key&&b.state!=='dying');
const diff=counts[c.key]-alive.length;
if(diff>0){for(let i=0;i<diff;i++){balls.push(makeBall(c,k++))}}
else if(diff<0){
const cand=alive.filter(b=>b.state!=='picking');
for(let i=0;i<-diff&&cand.length;i++){cand.pop().state='dying'}
}
});
}
function stepPhysics(dt){
const n=balls.length;
const floorY=BR+0.08;
const lim=R-BR;
for(let i=0;i<n;i++){
const b=balls[i];
if(b.state==='picking'||b.state==='dying')continue;
b.vel.y-=22*dt;
if(b.vel.lengthSq()<1.44)b.vel.multiplyScalar(0.9);
b.pos.addScaledVector(b.vel,dt);
}
for(let it=0;it<2;it++){
for(let i=0;i<n;i++){
const a=balls[i];
if(a.state==='picking'||a.state==='dying')continue;
for(let j=i+1;j<n;j++){
const c=balls[j];
if(c.state==='picking'||c.state==='dying')continue;
const dx=c.pos.x-a.pos.x,dy=c.pos.y-a.pos.y,dz=c.pos.z-a.pos.z;
const d2=dx*dx+dy*dy+dz*dz;
if(d2>=4*BR*BR)continue;
const d=Math.sqrt(d2)||0.0001;
const nx=dx/d,ny=dy/d,nz=dz/d;
const ov=(2*BR-d)*0.5;
a.pos.x-=nx*ov;a.pos.y-=ny*ov;a.pos.z-=nz*ov;
c.pos.x+=nx*ov;c.pos.y+=ny*ov;c.pos.z+=nz*ov;
const rv=(c.vel.x-a.vel.x)*nx+(c.vel.y-a.vel.y)*ny+(c.vel.z-a.vel.z)*nz;
if(rv<0){
const imp=-(1.12)*rv*0.5;
a.vel.x-=nx*imp;a.vel.y-=ny*imp;a.vel.z-=nz*imp;
c.vel.x+=nx*imp;c.vel.y+=ny*imp;c.vel.z+=nz*imp;
}
}
}
for(let i=0;i<n;i++){
const b=balls[i];
if(b.state==='picking'||b.state==='dying')continue;
if(b.pos.y<floorY){
b.pos.y=floorY;
if(b.vel.y<0)b.vel.y*=-0.2;
b.vel.x*=0.92;b.vel.z*=0.92;
}
if(b.pos.y<H+0.2){
const rr=Math.sqrt(b.pos.x*b.pos.x+b.pos.z*b.pos.z);
if(rr>lim){
const nx=b.pos.x/rr,nz=b.pos.z/rr;
b.pos.x=nx*lim;b.pos.z=nz*lim;
const vr=b.vel.x*nx+b.vel.z*nz;
if(vr>0){b.vel.x-=1.3*vr*nx;b.vel.z-=1.3*vr*nz}
}
}
}
}
}
function updateBalls(dt){
for(let i=balls.length-1;i>=0;i--){
const b=balls[i];
if(b.state==='dying'){
b.s-=dt*4;
if(b.s<=0){jarGroup.remove(b.mesh);b.mat.dispose();balls.splice(i,1);continue}
}else if(b.state==='free'&&b.s<1){
b.s=Math.min(1,b.s+dt*4);
}
if(b.flash>0){
b.flash-=dt*1.4;
if(b.state!=='picking')b.mat.emissiveIntensity=Math.max(0,b.flash)*0.6;
}
b.mesh.position.copy(b.pos);
b.mesh.scale.setScalar(Math.max(0.001,b.s));
}
}
function burst(v,hex,power){
for(let i=0;i<60;i++){
pPos[i*3]=v.x;pPos[i*3+1]=v.y;pPos[i*3+2]=v.z;
const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
const sp=(1.2+Math.random()*2.2)*(power||1);
pVel[i*3]=Math.sin(ph)*Math.cos(th)*sp;
pVel[i*3+1]=Math.cos(ph)*sp;
pVel[i*3+2]=Math.sin(ph)*Math.sin(th)*sp;
}
burstPoints.material.color.setHex(hex);
pLife=1;
burstPoints.geometry.attributes.position.needsUpdate=true;
}
function updateBurst(dt){
if(pLife<=0)return;
pLife-=dt*1.1;
for(let i=0;i<60;i++){
pPos[i*3]+=pVel[i*3]*dt;
pPos[i*3+1]+=pVel[i*3+1]*dt;
pPos[i*3+2]+=pVel[i*3+2]*dt;
pVel[i*3]*=0.96;pVel[i*3+1]=pVel[i*3+1]*0.96-2*dt;pVel[i*3+2]*=0.96;
}
burstPoints.material.opacity=Math.max(0,pLife);
burstPoints.geometry.attributes.position.needsUpdate=true;
}
function startPick(key){
if(!ready3d||pick)return false;
const cand=balls.filter(b=>b.color===key&&b.state==='free'&&b.s>=1);
if(!cand.length)return false;
const b=cand[Math.floor(Math.random()*cand.length)];
b.state='picking';
const c=COLORS.find(x=>x.key===key);
pickLight.color.setHex(c.hex);
pick={b:b,c:c,phase:0,t:0,from:b.pos.clone()};
return true;
}
function updatePick(dt){
if(!pick)return;
const b=pick.b;
const hover=new THREE.Vector3(0,H+1.7,0);
pick.t+=dt;
if(pick.phase===0){
const k=Math.min(1,pick.t/0.6);
const e=1-Math.pow(1-k,3);
b.pos.lerpVectors(pick.from,hover,e);
b.s=1+0.5*e;
b.mat.emissiveIntensity=0.55*e;
pickLight.intensity=1.6*e;
if(k>=1){pick.phase=1;pick.t=0;burst(hover,pick.c.hex,1)}
}else if(pick.phase===1){
b.pos.copy(hover);
b.pos.y+=Math.sin(pick.t*6)*0.07;
b.mesh.rotation.y+=dt*3;
if(pick.t>=0.55){pick.phase=2;pick.t=0}
}else{
const k=Math.min(1,pick.t/0.35);
b.pos.copy(hover);
b.s=1.5-0.5*k;
b.mat.emissiveIntensity=0.55*(1-k);
pickLight.intensity=1.6*(1-k);
if(k>=1){
b.state='free';
b.s=1;
b.vel.set(0,-2,0);
b.mat.emissiveIntensity=0;
b.flash=0;
pickLight.intensity=0;
pick=null;
}
}
}

function drawTrend(){
const cv=$('trend');
const w=cv.clientWidth,h=cv.clientHeight;
if(!w||!h)return;
const dpr=Math.min(window.devicePixelRatio||1,2);
if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
const g=cv.getContext('2d');
g.setTransform(dpr,0,0,dpr,0,0);
g.clearRect(0,0,w,h);
const L=40,Rr=12,Tp=14,B=28,gw=w-L-Rr,gh=h-Tp-B;
g.font='11px Prompt,Tahoma,sans-serif';
g.textBaseline='middle';
g.lineWidth=1;
g.strokeStyle='rgba(120,130,190,.22)';
g.fillStyle='#667092';
g.textAlign='right';
for(let p=0;p<=100;p+=25){
const y=Tp+gh*(1-p/100);
g.beginPath();g.moveTo(L,y);g.lineTo(L+gw,y);g.stroke();
g.fillText(p+'%',L-6,y);
}
const total=sum(counts);
COLORS.forEach(c=>{
const y=Tp+gh*(1-pct(counts[c.key],total)/100);
g.save();
g.setLineDash([5,4]);
g.globalAlpha=0.7;
g.strokeStyle=c.css;
g.lineWidth=1.6;
g.beginPath();g.moveTo(L,y);g.lineTo(L+gw,y);g.stroke();
g.restore();
});
const n=hist.red.length;
if(!n){
g.fillStyle='#667092';
g.textAlign='center';
g.fillText(t('noData'),L+gw/2,Tp+gh/2);
return;
}
COLORS.forEach(c=>{
const arr=hist[c.key];
g.strokeStyle=c.css;
g.fillStyle=c.css;
g.lineWidth=2.2;
g.lineJoin='round';
if(n===1){
g.beginPath();g.arc(L,Tp+gh*(1-arr[0]/100),3.5,0,Math.PI*2);g.fill();
return;
}
g.beginPath();
for(let i=0;i<n;i++){
const x=L+gw*(i/(n-1)),y=Tp+gh*(1-arr[i]/100);
if(i===0)g.moveTo(x,y);else g.lineTo(x,y);
}
g.stroke();
});
g.fillStyle='#667092';
g.textBaseline='top';
g.textAlign='left';
g.fillText('1',L,Tp+gh+8);
g.textAlign='right';
g.fillText(String(n)+' '+t('times'),L+gw,Tp+gh+8);
}

results={red:0,blue:0,green:0};
totalDraws=0;
hist.red.length=0;hist.blue.length=0;hist.green.length=0;
const n=+$('draws').value;
runState={left:n,n:n,acc:0};
setRunning(true);
refreshResults();
}
function resetAll(){
runState=null;
setRunning(false);
results={red:0,blue:0,green:0};
totalDraws=0;
hist.red.length=0;hist.blue.length=0;hist.green.length=0;
lastInfo=null;
update();
}
function tickRun(dt){
if(!runState)return;
const rate=Math.min(240,Math.max(6,runState.n*0.9));
runState.acc+=rate*dt;
let cnt=0,lastC=null;
while(runState.acc>=1&&runState.left>0){
lastC=rollColor();
record(lastC);
runState.left--;
runState.acc-=1;
cnt++;
}
if(cnt){
lastInfo={type:'draw',key:lastC.key};
if(!pick)startPick(lastC.key);
}
if(runState.left<=0){
lastInfo={type:'run',n:runState.n};
runState=null;
setRunning(false);
showToast('✅ '+t('doneRun')+totalDraws+' '+t('times'));
refreshResults();
}else if(cnt){
refreshResults();
}
}

function buildQuiz(){
$('qlist').innerHTML=QZ.map((q,i)=>'<div class="question"><p id="qp'+i+'"></p><div class="options">'+['a','b','c'].map(v=>'<label><input type="radio" name="'+q.n+'" value="'+v+'"><span id="qo'+i+v+'"></span></label>').join('')+'</div><div class="feedback" id="f'+(i+1)+'"></div></div>').join('');
}
function applyQuiz(){
QZ.forEach((q,i)=>{
$('qp'+i).textContent=t('q')[i];
['a','b','c'].forEach((v,j)=>{$('qo'+i+v).textContent=t('qa')[i][j]});
$('f'+(i+1)).textContent='';
$('f'+(i+1)).className='feedback';
});
$('score').textContent='';
}
function celebrate(){
if(!ready3d)return;
[0xef476f,0x4d8cff,0x22b39a].forEach((hx,i)=>{
setTimeout(()=>burst(new THREE.Vector3(0,H+1.7,0),hx,1.6),i*380);
});
}

function applyLang(){
document.documentElement.lang=lang;
document.title=t('docTitle');
document.querySelectorAll('[data-i18n]').forEach(el=>{const v=t(el.dataset.i18n);if(v!==undefined)el.textContent=v});
document.querySelectorAll('[data-i18n-title]').forEach(el=>{const v=t(el.dataset.i18nTitle);el.title=v;el.setAttribute('aria-label',v)});
$('lang-th').classList.toggle('active',lang==='th');
$('lang-en').classList.toggle('active',lang==='en');
$('lang-th').setAttribute('aria-pressed',lang==='th');
$('lang-en').setAttribute('aria-pressed',lang==='en');
HS.forEach((h,i)=>{hsEls[i].querySelector('.tip').textContent=t('hs')[h.id].t});
buildExplore();
applyQuiz();
if(curCard){openCard(curCard,curBall)}
update();
}

function resize(){
const w=stage.clientWidth,h=stage.clientHeight;
if(!ready3d||!w||!h)return;
renderer.setSize(w,h,false);
camera.aspect=w/h;
camera.updateProjectionMatrix();
const portrait=w/h<1.15;
if(wasPortrait!==null&&wasPortrait!==portrait)flyTo('home',true);
wasPortrait=portrait;
}

const ray=has3D?new THREE.Raycaster():null;
const mouse=has3D?new THREE.Vector2():null;
let downPt=null;
function bindCanvas(){
const cv=$('gl');
cv.addEventListener('pointerdown',e=>{downPt={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointerup',e=>{
if(!downPt||!ready3d)return;
const moved=Math.hypot(e.clientX-downPt.x,e.clientY-downPt.y);
downPt=null;
if(moved>6)return;
const r=cv.getBoundingClientRect();
mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
ray.setFromCamera(mouse,camera);
const hit=ray.intersectObjects(balls.map(b=>b.mesh),false)[0];
if(!hit)return;
const b=balls.find(x=>x.mesh===hit.object);
if(!b)return;
b.flash=1;
const wp=new THREE.Vector3();
b.mesh.getWorldPosition(wp);
burst(jarGroup.worldToLocal(wp.clone()),COLORS.find(c=>c.key===b.color).hex,0.6);
openCard('ball',b.color);
});
}

let lastT=performance.now();
function frame(now){
requestAnimationFrame(frame);
const dt=Math.min(0.05,(now-lastT)/1000);
lastT=now;
tickRun(dt);
if(!ready3d)return;
stepPhysics(dt/2);
stepPhysics(dt/2);
updateBalls(dt);
updatePick(dt*(runState?2.2:1));
updateBurst(dt);
updateBars(dt);
dust.rotation.y+=dt*0.02;
if(tween){
const k=Math.min(1,(now-tween.t0)/tween.dur);
const e=k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
camera.position.lerpVectors(tween.p0,tween.p1,e);
controls.target.lerpVectors(tween.q0,tween.q1,e);
if(k>=1)tween=null;
}
controls.update();
placeHotspots();
renderer.render(scene,camera);
}

function init(){
buildQuiz();
if(has3D){
buildHotspots();
try{build3D()}catch(err){$('fallback').style.display='grid'}
}else{
$('fallback').style.display='grid';
}
['red','blue','green','draws'].forEach(id=>$(id).addEventListener('input',update));
$('btnRun').addEventListener('click',runMany);
$('btnStep').addEventListener('click',drawOnce);
$('btnClear').addEventListener('click',resetAll);
$('btnView').addEventListener('click',()=>flyTo('home'));
$('btnRotate').addEventListener('click',()=>{
if(!ready3d)return;
controls.autoRotate=!controls.autoRotate;
$('btnRotate').classList.toggle('on',controls.autoRotate);
});
$('cardClose').addEventListener('click',closeCard);
$('cardPrev').addEventListener('click',()=>stepCard(-1));
$('cardNext').addEventListener('click',()=>stepCard(1));
document.querySelectorAll('.tab').forEach(tb=>tb.addEventListener('click',()=>{
document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===tb));
document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id==='pane-'+tb.dataset.tab));
if(tb.dataset.tab==='res')drawTrend();
}));
$('lang-th').addEventListener('click',()=>{lang='th';applyLang()});
$('lang-en').addEventListener('click',()=>{lang='en';applyLang()});
$('quiz').addEventListener('submit',e=>{
e.preventDefault();
let s=0;
QZ.forEach((q,i)=>{
const ch=document.querySelector('input[name="'+q.n+'"]:checked');
const f=$('f'+(i+1));
if(ch&&ch.value===q.c){s++;f.className='feedback correct';f.textContent=t('correct')+t('explanations')[i]}
else{f.className='feedback incorrect';f.textContent=t('incorrect')+t('explanations')[i]}
});
$('score').textContent=t('score')+s+'/3'+(s===3?' 🎉':'');
if(s===3)celebrate();
});
$('showAnswers').addEventListener('click',()=>{
QZ.forEach((q,i)=>{$('f'+(i+1)).className='feedback';$('f'+(i+1)).textContent=t('explanations')[i]});
});
$('clearQuiz').addEventListener('click',()=>{
$('quiz').reset();
for(let i=1;i<=3;i++){$('f'+i).textContent='';$('f'+i).className='feedback'}
$('score').textContent='';
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCard()});
if(has3D){
bindCanvas();
if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(stage);
window.addEventListener('resize',resize);
}
window.addEventListener('resize',drawTrend);
setTimeout(()=>$('hint').classList.add('hide'),12000);
applyLang();
requestAnimationFrame(frame);
}
init();
})();
</script>
</body>
</html>
